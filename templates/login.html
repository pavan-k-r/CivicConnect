<!DOCTYPE html>
<html>
<head>
    <title>CivicConnect - Authority Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Authority Login</h1>

        <p>Authorized personnel only.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <br>

        <a href="/">← Back to CivicConnect</a>

    </div>

</body>
</html>
